# Source language.
language: java

# Supported JDKs.
jdk:
  - openjdk21

# Cache Maven stuff.
cache:
  directories:
    - $HOME/.m2

# Execute unit tests.
script:
  - src/etc/travis/run-unit-tests.sh

# Deploy artifacts.
jobs:
  include:
    - stage: deploy
      jdk: openjdk21
      if: branch = master and tag is present
      script:
        - src/etc/travis/deploy-artifacts.sh
    - stage: deploy
      jdk: openjdk21
      if: branch = develop
      script:
        - src/etc/travis/deploy-artifacts.sh